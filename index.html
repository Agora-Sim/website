<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/monogram.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO:start — per-route head, stamped by scripts/prerender.mjs.
         These are the home defaults, and what the dev server shows. -->
    <title>AgoraSim: Projetar Portugal</title>
    <meta name="description" content="A AgoraSim modela o impacto de medidas de política pública com dados abertos e métodos revistos por pares." />
    <link rel="canonical" href="https://agorasimlab.com/" />
    <meta property="og:url" content="https://agorasimlab.com/" />
    <meta property="og:title" content="AgoraSim: Projetar Portugal" />
    <meta property="og:description" content="A AgoraSim modela o impacto de medidas de política pública com dados abertos e métodos revistos por pares." />
    <meta name="twitter:title" content="AgoraSim: Projetar Portugal" />
    <meta name="twitter:description" content="A AgoraSim modela o impacto de medidas de política pública com dados abertos e métodos revistos por pares." />
    <!-- SEO:end -->

    <!-- Invariant across routes, so kept out of the SEO block above. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgoraSim" />
    <meta property="og:locale" content="pt_PT" />
    <meta
      property="og:image"
      content="https://agorasimlab.com/social-card.png"
    />
    <!-- Fixed 1200×630, so scrapers render the card without downloading it
         first to measure; og:image:alt describes it for screen readers. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A marca AgoraSim sobre uma planta técnica azul, com «Análise de políticas públicas · Open source»."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://agorasimlab.com/social-card.png"
    />

    <!-- Structured data: names the site's owner as an Organization so search
         engines resolve "AgoraSim" to a single entity rather than guessing.
         Inline JSON-LD is not executable script, but `script-src 'self'`
         blocks any inline <script>, so _headers whitelists this block by its
         sha256 hash — recompute and update that hash if the JSON changes. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://agorasimlab.com/#organization",
          "name": "AgoraSim",
          "url": "https://agorasimlab.com/",
          "logo": "https://agorasimlab.com/social-card.png",
          "description": "A AgoraSim modela o impacto de medidas de política pública com dados abertos e métodos revistos por pares.",
          "sameAs": ["https://github.com/Agora-Sim"]
        },
        {
          "@type": "WebSite",
          "@id": "https://agorasimlab.com/#website",
          "url": "https://agorasimlab.com/",
          "name": "AgoraSim",
          "inLanguage": "pt-PT",
          "publisher": { "@id": "https://agorasimlab.com/#organization" }
        }
      ]
    }
    </script>

    <!-- Matches --color-blueprint, the body background, so a mobile browser's
         chrome continues the field rather than banding above it. -->
    <meta name="theme-color" content="#1248a1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
