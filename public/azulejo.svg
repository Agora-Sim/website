<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 100 100">
  <!-- The azulejo tile, single source for every surface that draws it.
       Strokes are white so it can be used directly as a background-image on
       Blueprint; anywhere the ink differs it is used as a mask-image
       instead, which reads alpha and ignores the colour entirely.
       The 160px render is 2x the 80px grid cell, so every corner dot lands
       on a grid intersection. Change the geometry here and nowhere else. -->
  <g fill="none" stroke="#ffffff" stroke-width="1.15">
    <path d="M50 5 L95 50 L50 95 L5 50 Z"/>
    <path d="M50 24 L76 50 L50 76 L24 50 Z"/>
    <circle cx="50" cy="50" r="7"/>
    <path d="M0 24 A 24 24 0 0 0 24 0"/>
    <path d="M76 0 A 24 24 0 0 0 100 24"/>
    <path d="M100 76 A 24 24 0 0 0 76 100"/>
    <path d="M24 100 A 24 24 0 0 0 0 76"/>
    <path d="M50 5 L44 14 L56 14 Z"/>
    <path d="M50 95 L44 86 L56 86 Z"/>
    <path d="M5 50 L14 44 L14 56 Z"/>
    <path d="M95 50 L86 44 L86 56 Z"/>
  </g>
  <g fill="#ffffff">
    <circle cx="0" cy="0" r="4"/>
    <circle cx="100" cy="0" r="4"/>
    <circle cx="0" cy="100" r="4"/>
    <circle cx="100" cy="100" r="4"/>
  </g>
</svg>
